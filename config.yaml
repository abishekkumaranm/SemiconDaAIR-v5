# config.yaml — Reproducibility & Experiment Hyperparameter Configuration

experiment:
  name: SemiconDaAIR-v6
  version: 6.0.0
  seed: 42
  device: cuda

model:
  in_channels: 1
  out_channels: 1
  base_channels: 64
  scale: 2
  fingerprint_dim: 16
  bottleneck_reduction: 2
  expert_reduction: 8

dataset:
  gt_dir: C:\Users\HP\Downloads\dataset\train\train\GT
  lq_dir: C:\Users\HP\Downloads\dataset\train\train\NoisyLR
  train_split: splits/train.txt
  val_split: splits/val.txt
  patch_size: 128
  augment: true

training:
  epochs: 25
  batch_size: 16
  learning_rate: 2.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  use_amp: true
  checkpoint_dir: checkpoints/final

loss:
  alpha_charbonnier: 1.0
  alpha_sobel: 0.2
  alpha_frequency: 0.15
  alpha_ssim: 0.1
  alpha_defect: 0.2
  lambda_degradation: 0.05
